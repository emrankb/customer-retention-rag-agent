name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run foundation and retrieval contract tests
        run: python -m unittest discover -s tests -v

  retrieval-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-retrieval.txt
      - name: Install retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-retrieval.txt
          python -m pip check
      - name: Check LangChain and FAISS integration
        run: python -m unittest discover -s tests -v
